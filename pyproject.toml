[project]
name = "MRD"
version = "0.1.0"
description = "Environment for MRD (Metamers Rendered Differentiably)"
author = [{ name = "Benjamin Beilharz", email = "b@ben.graphics" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cholespy>=2.1.0",
    "diffusers>=0.35.1",
    "flip-evaluator>=1.7",
    "gpytoolbox>=0.3.7",
    "lpips>=0.1.4",
    "mitsuba>=3.9.0",
    "modelvshuman",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2.3",
    "scikit-learn>=1.7.2",
    "scipy-stubs~=1.15.0",
    "torchmetrics>=1.7.3",
    "transformers>=4.52.4",
    "wandb[media]>=0.21.4",
]

[tool.uv.sources]
modelvshuman = { path = "vendor/model-vs-human" }

[dependency-groups]
dev = [
    "debugpy>=1.8.13",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.6",
]
